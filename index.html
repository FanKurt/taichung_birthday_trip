function render(resetScroll=true){const views={home:homeView,schedule:scheduleView,expense:expenseViewHTML,checklist:checklistView,info:infoView},c=document.getElementById('content');const p=c.scrollTop;c.innerHTML=views[tab]();c.scrollTop=resetScroll?0:p;navRender()}
function modalHTML(title,body,buttons=''){return `<div class="modal-cover" data-action="modal-background"><div class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><div class="modal-head"><h2>${safe(title)}</h2><button class="iconbutton" data-action="close-modal" aria-label="關閉">×</button></div>${body}${buttons}</div></div>`}
function openExpense(id=null,prefill={}){const e=id?(store.expenses||[]).find(x=>x.id===id):null;const date=e?.date||prefill.date||days[Math.max(0,globalStatus().day)].date;const title=e?.title||prefill.title||'';const cat=e?.cat||prefill.cat||'food';const amount=e?.amount||'';const memo=e?.memo||'';const body=`<form id="expenseForm" data-edit-id="${safe(e?.id||'')}"><div class="field"><label for="exp-title">項目名稱</label><input id="exp-title" name="title" placeholder="例如：午餐、停車、飲料" maxlength="60" value="${safe(title)}" required></div><div class="field-grid"><div class="field"><label for="exp-amount">金額（NT$）</label><input id="exp-amount" name="amount" inputmode="numeric" type="number" min="1" max="99999999" placeholder="0" value="${safe(amount)}" required></div><div class="field"><label for="exp-cat">分類</label><select id="exp-cat" name="cat">${Object.entries(categories).map(([k,v])=>`<option value="${k}" ${cat===k?'selected':''}>${safe(v.name)}</option>`).join('')}</select></div></div><div class="field"><label for="exp-date">日期</label><input id="exp-date" name="date" type="date" min="2026-11-14" max="2026-11-16" value="${safe(date)}" required></div><div class="field"><label for="exp-memo">備註（選填）</label><textarea id="exp-memo" name="memo" maxlength="180" placeholder="例如：兩大兩小、停車兩小時">${safe(memo)}</textarea></div><div class="modal-actions">${e?`<button type="button" class="btn danger" data-action="remove-expense" data-id="${safe(e.id)}">刪除</button>`:''}<button type="button" class="btn light" data-action="close-modal">取消</button><button type="submit" class="btn">${icon('save',15)} 儲存</button></div></form>`;document.getElementById('overlay').innerHTML=modalHTML(e?'編輯花費':'新增一筆花費',body);document.getElementById('exp-title').focus()}
function openChecklistForm(){const body=`<form id="checkForm"><div class="field"><label for="check-name">待辦內容</label><input id="check-name" name="label" maxlength="80" placeholder="例如：備用充電線" required></div><div class="field"><label for="check-group">清單分類</label><select id="check-group" name="group"><option>小朋友用品</option><option>大人用品</option><option>旅行必備</option><option>其他事項</option></select></div><div class="modal-actions"><button type="button" class="btn light" data-action="close-modal">取消</button><button type="submit" class="btn">${icon('plus',15)} 加入清單</button></div></form>`;document.getElementById('overlay').innerHTML=modalHTML('新增行前待辦',body);document.getElementById('check-name').focus()}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function openExternal(url){const nw=window.open(url,'_blank','noopener,noreferrer');if(!nw){window.location.href=url}}
function backup(){const payload={app:'taichung_birthday_trip',version:1,exportedAt:new Date().toISOString(),data:store};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='taichung_birthday_trip_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('備份檔已匯出')}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result),data=v?.data;if(v?.app!=='taichung_birthday_trip'||!data||!Array.isArray(data.expenses)||typeof data.checks!=='object'||!Array.isArray(data.customChecks)||typeof data.done!=='object')throw new Error('格式不正確');if(!confirm('匯入備份會覆蓋目前所有記帳、打包與行程完成狀態，確定繼續？'))return;store={...structuredClone(STARTER),...data};save();render();notify('備份資料已還原')}catch(e){notify('匯入失敗：'+e.message)}};reader.readAsText(f)};inp.click()}
const phone=document.getElementById('phone');
phone.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const act=a.dataset.action;if(act==='modal-background' && e.target!==a)return;if(act==='tab'){tab=a.dataset.tab;render();return}if(act==='goto-day'){activeDay=Number(a.dataset.day);tab='schedule';render();return}if(act==='select-day'){activeDay=Number(a.dataset.day);render();return}if(act==='toggle-event'){store.done[a.dataset.id]=!store.done[a.dataset.id];save();render(false);return}if(act==='toggle-check'){store.checks[a.dataset.id]=!store.checks[a.dataset.id];save();render(false);return}if(act==='delete-check'){e.stopPropagation();if(confirm('確定刪除此自訂項目？')){store.customChecks=store.customChecks.filter(x=>x.id!==a.dataset.id);delete store.checks[a.dataset.id];save();render(false)}return}if(act==='new-check'){openChecklistForm();return}if(act==='new-expense'){openExpense();return}if(act==='edit-expense'){openExpense(a.dataset.id);return}if(act==='quick-expense'){openExpense(null,{date:a.dataset.day,title:a.dataset.title,cat:a.dataset.cat});return}if(act==='remove-expense'){if(confirm('確定刪除此筆費用？')){store.expenses=store.expenses.filter(x=>x.id!==a.dataset.id);save();closeModal();render(false);notify('已刪除花費')}return}if(act==='expense-view'){expenseView=a.dataset.value;render(false);return}if(act==='close-modal'||act==='modal-background'){closeModal();return}if(act==='maps'){openExternal(mapUrl(a.dataset.place,a.dataset.mode||'driving'));return}if(act==='call'){window.location.href='tel:'+a.dataset.tel;return}if(act==='url'){openExternal(a.dataset.url);return}if(act==='export-data'){backup();return}if(act==='import-data'){importData();return}});
phone.addEventListener('submit',e=>{if(e.target.id==='expenseForm'){e.preventDefault();const f=new FormData(e.target),id=e.target.dataset.editId,title=String(f.get('title')||'').trim(),amount=Number(f.get('amount'));if(!title||!Number.isFinite(amount)||amount<=0){notify('請輸入名稱及有效金額');return}const item={id:id||'exp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),title,amount:Math.round(amount),cat:f.get('cat'),date:f.get('date'),memo:String(f.get('memo')||'').trim()};store.expenses=Array.isArray(store.expenses)?store.expenses:[];if(id){store.expenses=store.expenses.map(x=>x.id===id?item:x)}else{store.expenses.push(item)}save();closeModal();render(false);notify('記帳已儲存')}if(e.target.id==='checkForm'){e.preventDefault();const f=new FormData(e.target),label=String(f.get('label')||'').trim();if(!label)return;store.customChecks=[...(store.customChecks||[]),{id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),label,group:String(f.get('group')||'其他事項'),custom:true}];save();closeModal();render(false);notify('待辦已加入清單')}});
phone.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key===' '||e.key==='Enter')&&e.target.matches('.checkrow[role="checkbox"]')){e.preventDefault();e.target.click()}});
render();

</script>
